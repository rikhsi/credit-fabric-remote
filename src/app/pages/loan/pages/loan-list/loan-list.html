@if (isLoading()) { @for (item of [] | emptyList:8; track $index) {
<nz-skeleton-element [nzActive]="true" nzType="button" [nzSize]="'large'" class="skeleton" />
} } @else { @if (isEligible()) { @for (item of items(); track $index) {
<cf-card-product
  [id]="item.id"
  [title]="item.name"
  [description]="item.tag"
  [image]=""
  [annualRate]="item.conditions | conditionRate"
  [loanAmount]="item.conditions | conditionAmount"
  [loanTerm]="item.conditions | conditionTerm | monthsToYears"
/>
} } @else {
<cf-not-eligible />
} }

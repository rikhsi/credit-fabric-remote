@let incomplete = hasIncomplete();

<ng-container *transloco="let t">
  <cf-card [titleRef]="titleRef" [showSpace]="!incomplete" class="bordered">
    <div actions>
      <button cfBounce nz-button nzType="default" nzSize="small" [disabled]="isLoading()" (clicked)="onFill()">
        <strong>{{ incomplete ? t('action.fill') : t('action.edit') }}</strong>
        @if (isLoading()) {
        <nz-spin nzSimple nzSize="small" />
        } @else {
        <nz-icon nzType="f:pencil" />
        }
      </button>
    </div>

    @if (!incomplete) {
    <div class="list">
      @for (item of items(); track item.sysAddressTypeId) {
      <cf-address-info-item [item]="item" (edit)="edit.emit($index)" />
      }
    </div>
    }
  </cf-card>

  <ng-template #titleRef>
    <div class="titleRef">
      <h2 nz-typography>{{ t('prop.address') }}</h2>

      @if (incomplete) {
      <nz-tag>
        <nz-icon nzType="info-circle" />
        {{ t('alert.fill_fields') }}
      </nz-tag>
      }
    </div>
  </ng-template>
</ng-container>

<ng-container *transloco="let t">
  @if (isModal) {
  <cf-form-box [title]="t('prop.add_additional_contacts')" (closeClick)="close()" (submitClick)="submit()">
    <ng-container *ngTemplateOutlet="fields" />
  </cf-form-box>
  } @else {
  <div class="inline">
    <h2 class="inline-title">{{ t('prop.additional_contacts') }}</h2>

    <div class="inline-alert">
      <nz-icon nzType="info-circle" />
      <span>{{ t('alert.contacts_fill') }}</span>
    </div>

    <ng-container *ngTemplateOutlet="fields" />
  </div>
  }
</ng-container>

<ng-template #fields>
  <ng-container *transloco="let t">
    <div class="list">
      <cf-label-control-secondary style="align-items: flex-start; width: 100%" [label]="t('prop.first_name')">
        <cf-input-default [formField]="contactForm().firstName" [placeholder]="t('control.input.placeholder')" size="large" />
      </cf-label-control-secondary>

      <cf-label-control-secondary style="align-items: flex-start; width: 100%" [label]="t('prop.last_name')">
        <cf-input-default [formField]="contactForm().lastName" [placeholder]="t('control.input.placeholder')" size="large" />
      </cf-label-control-secondary>

      <cf-label-control-secondary style="align-items: flex-start; width: 100%" [label]="t('prop.phone_number')">
        <cf-input-default
          [formField]="contactForm().mobilePhone"
          mask="00 000 00 00"
          maskPrefix="+998 "
          [placeholder]="t('control.input.placeholder')"
          size="large"
        />
      </cf-label-control-secondary>

      <cf-label-control-secondary style="align-items: flex-start; width: 100%" [label]="t('prop.relationship')">
        <cf-select-default
          class="cf-hide-xs"
          [formField]="contactForm().dirFamilyRelationshipId"
          [placeholder]="t('control.select.placeholder')"
          size="large"
        >
          <ng-container *cfHandbook="{ type: 'dir-family-relationship' }; let items">
            @for (item of items; track item.id) {
            <nz-option [nzValue]="item.id" [nzLabel]="item.name"></nz-option>
            }
          </ng-container>
        </cf-select-default>

        <cf-select-default-mobile
          class="cf-show-xs"
          [formField]="contactForm().dirFamilyRelationshipId"
          [handbook]="{ type: 'dir-family-relationship' }"
          [placeholder]="t('control.select.placeholder')"
          size="large"
        />
      </cf-label-control-secondary>
    </div>
  </ng-container>
</ng-template>

<ng-container *transloco="let t">
  @let phone = `
  <a href="tel: 1809">1809</a>
  `;

  <div class="circle">
    <nz-icon nzType="f:hourglass" class="icon" />
  </div>

  <h4 nz-typography>{{ t('loan.not_eligible.title') }}</h4>
  <p nz-typography [innerHTML]="t('loan.not_eligible.description', {phone})"></p>

  <button cfBounce nz-button nzType="primary" nzSize="large" type="button" (clicked)="findBranch()">{{ t('action.find_place') }}</button>
</ng-container>

<ng-container *transloco="let t">
  <div class="branch-select" [class.branch-select--inline]="inline()">
    @if (inline()) {
    <h2 class="inline-title">{{ t('prop.branch') }}</h2>

    <div class="inline-alert">
      <nz-icon nzType="info-circle" />
      <span>{{ t('alert.branch_fill') }}</span>
    </div>
    }

    <cf-label-control-secondary style="align-items: flex-start; width: 100%" [label]="t('prop.branch')">
      <cf-select-default
        class="cf-hide-xs"
        [formField]="form().filialCode"
        [placeholder]="t('control.select.placeholder')"
        [isLoading]="isLoading()"
        size="large"
      >
        @for (option of options(); track option.value) {
        <nz-option [nzValue]="option.value" [nzLabel]="option.label"></nz-option>
        }
      </cf-select-default>

      <cf-select-default-mobile
        class="cf-show-xs"
        [formField]="form().filialCode"
        [staticOptions]="options()"
        [placeholder]="t('control.select.placeholder')"
        size="large"
      />
    </cf-label-control-secondary>
  </div>
</ng-container>

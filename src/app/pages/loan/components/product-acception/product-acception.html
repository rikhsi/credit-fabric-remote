<ng-container *transloco="let t">
  <label nz-checkbox [formField]="form().offer" [class.error]="showOfferError()">
    <span [innerHTML]="t('prop.public_offer')"></span>
  </label>

  <button cfBounce nz-button nzType="primary" nzSize="large" [nzLoading]="isSubmitting()" [disabled]="isSubmitting()" (clicked)="apply()">
    {{t('action.apply')}}
  </button>
</ng-container>
